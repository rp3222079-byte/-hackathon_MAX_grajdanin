# Все локальные компоненты «Домового» одной командой:
#   cp .env.example .env   # и впишите MAX_BOT_TOKEN
#   docker compose up --build

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://domovoy:domovoy@db:5432/domovoy
  API_BASE_URL: http://api:8000

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: domovoy
      POSTGRES_PASSWORD: domovoy
      POSTGRES_DB: domovoy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domovoy"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    # миграции и тестовые данные при каждом старте: повторный запуск дублей не создаёт
    command: ["sh", "-c", "python -m app.seed && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    env_file: .env
    environment: *app-env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  bot:
    build: .
    command: ["python", "-m", "app.bot.main"]
    env_file: .env
    environment:
      <<: *app-env
      BOT_STATE_PATH: /app/state/bot_state.json
    volumes:
      - botstate:/app/state
      # письма в режиме SMTP_DRY_RUN=true; скопировать к себе:
      #   docker compose cp bot:/app/outbox ./outbox
      - outbox:/app/outbox
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  botstate:
  outbox:
