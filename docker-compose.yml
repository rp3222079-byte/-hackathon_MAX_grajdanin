services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: domovoy
      POSTGRES_PASSWORD: domovoy
      POSTGRES_DB: domovoy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domovoy"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    # справочник УК и демо-отключения загружаются при каждом старте, повтор не создаёт дублей
    command: ["sh", "-c", "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://domovoy:domovoy@db:5432/domovoy
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  bot:
    build: .
    command: ["python", "-m", "app.bot.main"]
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    volumes:
      # письма в режиме SMTP_DRY_RUN отправляет бот, поэтому outbox смонтирован к нему
      - ./outbox:/app/outbox
    restart: unless-stopped

volumes:
  pgdata:
